{% extends "base.html" %}

{% block title %}Log in · FitTrack{% endblock %}

{% block content %}
  <div class="auth-card card">
    <h1 class="auth-card__title">Welcome back</h1>
    <p class="auth-card__subtitle">Log in to keep tracking your progress.</p>

    <form id="login-form" novalidate>
      <p class="form-error" data-error hidden></p>

      <div class="field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="button button--primary button--block">
        Log in
      </button>
    </form>

    <p class="auth-card__footer">
      No account yet? <a href="/register">Create one</a>
    </p>
  </div>
{% endblock %}

{% block scripts %}
  <script type="module">
    import { wireAuthForm } from "/static/js/auth.js";

    wireAuthForm({
      formId: "login-form",
      endpoint: "/api/auth/login",
      redirectTo: "/dashboard",
      pendingLabel: "Logging in…",
    });
  </script>
{% endblock %}

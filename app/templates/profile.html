{% extends "base.html" %}

{% block title %}Profile · FitTrack{% endblock %}

{% block content %}
  <section class="page-header">
    <h1 class="page-header__title">Your profile</h1>
    <p class="page-header__subtitle">
      These stats set your daily calorie and macro goals.
    </p>
  </section>

  <div class="card form-card">
    <form id="profile-form">
      <p class="form-error" data-error hidden></p>

      <div class="field">
        <label>Height</label>
        <div class="field-row">
          <div class="field-inline">
            <input
              type="number"
              name="feet"
              min="1"
              max="8"
              inputmode="numeric"
              required
            />
            <span class="field-inline__unit">ft</span>
          </div>
          <div class="field-inline">
            <input
              type="number"
              name="inches"
              min="0"
              max="11"
              inputmode="numeric"
              required
            />
            <span class="field-inline__unit">in</span>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="weight_lbs">Weight</label>
        <div class="field-inline">
          <input
            type="number"
            name="weight_lbs"
            id="weight_lbs"
            min="1"
            step="0.1"
            inputmode="decimal"
            required
          />
          <span class="field-inline__unit">lbs</span>
        </div>
      </div>

      <div class="field">
        <label for="birth_date">Date of birth</label>
        <input type="date" name="birth_date" id="birth_date" required />
      </div>

      <div class="field">
        <label for="sex">Sex</label>
        <select name="sex" id="sex" required>
          <option value="" disabled selected>Choose…</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
        <p class="field__hint">Used by the metabolic-rate formula.</p>
      </div>

      <div class="field">
        <label for="activity_level">Activity level</label>
        <select name="activity_level" id="activity_level" required>
          <option value="" disabled selected>Choose…</option>
          <option value="sedentary">Sedentary — little or no exercise</option>
          <option value="light">Light — exercise 1–3 days/week</option>
          <option value="moderate">Moderate — exercise 3–5 days/week</option>
          <option value="active">Active — exercise 6–7 days/week</option>
          <option value="very_active">
            Very active — hard exercise or a physical job
          </option>
        </select>
      </div>

      <div class="field">
        <label for="goal">Goal</label>
        <select name="goal" id="goal" required>
          <option value="" disabled selected>Choose…</option>
          <option value="lose">Lose weight</option>
          <option value="maintain">Maintain weight</option>
          <option value="gain">Gain weight</option>
        </select>
      </div>

      <button type="submit" class="button button--primary button--block">
        Save profile
      </button>
    </form>
  </div>
{% endblock %}

{% block scripts %}
  <script type="module">
    import { initProfileForm } from "/static/js/profile.js";
    initProfileForm();
  </script>
{% endblock %}

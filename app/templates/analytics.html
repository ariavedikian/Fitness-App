{% extends "base.html" %}

{% block title %}Analytics · FitTrack{% endblock %}

{% block content %}
  <section class="page-header">
    <h1 class="page-header__title">Analytics</h1>
    <p class="page-header__subtitle">Your calorie and macro trends over time.</p>
  </section>

  <div class="analytics-controls">
    <label class="analytics-controls__label" for="range-select">Range</label>
    <select id="range-select" class="analytics-controls__select">
      <option value="7">Last 7 days</option>
      <option value="30" selected>Last 30 days</option>
      <option value="90">Last 90 days</option>
    </select>
  </div>

  <section class="chart" aria-labelledby="calorie-heading">
    <div class="today__header">
      <h2 id="calorie-heading" class="today__title">Calories eaten</h2>
    </div>
    <div id="calorie-chart"></div>
  </section>

  <section class="chart" aria-labelledby="macro-heading">
    <div class="today__header">
      <h2 id="macro-heading" class="today__title">Macros</h2>
    </div>
    <div id="macro-chart"></div>
  </section>
{% endblock %}

{% block scripts %}
  <script type="module">
    import { initAnalytics } from "/static/js/analytics.js";
    initAnalytics();
  </script>
{% endblock %}

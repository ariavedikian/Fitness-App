{% extends "base.html" %}

{% block title %}Diary · FitTrack{% endblock %}

{% block content %}
  <section class="page-header">
    <h1 class="page-header__title">Diary</h1>
    <p class="page-header__subtitle">Everything you've logged, by meal.</p>
  </section>

  <div class="diary">
    <div class="diary__bar">
      <div class="field diary__date">
        <label for="diary-date">Date</label>
        <input type="date" id="diary-date" class="search__input" />
      </div>
      <a class="button button--ghost" href="/foods">Add food</a>
    </div>

    <div id="diary-content"></div>
  </div>
{% endblock %}

{% block scripts %}
  <script type="module">
    import { initDiary } from "/static/js/diary.js";
    initDiary();
  </script>
{% endblock %}
